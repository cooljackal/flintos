[package]
name = "kernel"
publish = false
version.workspace = true
edition.workspace = true
description = "FlintOS kernel — scheduler, IPC, debug subsystems"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hal = { path = "../hal" }
api = { path = "../api" }
board = { path = "../board", default-features = false, optional = true }

# The key/value format. Portable and host-testable, unlike the flash under it,
# which is why the two are separate crates and this one is not target-scoped.
kvstore = { path = "../lib/kvstore" }
# The radio heap. See kernel/src/heap.rs -- present for the blobs, not
# registered as a global allocator.
heap = { path = "../lib/heap" }

# The console UART is the one driver the kernel itself names: `startup::init`
# constructs it from the board manifest so log and panic have somewhere to go
# before any application code runs.
#
# The other eight drivers are deliberately absent. The kernel used to depend on
# all nine, but Rust dependencies are not transitive -- an application wanting
# `bme280` declares it itself -- and the kernel re-exports none of them, so no
# symbol could ever reach them. `--gc-sections` kept them out of the image, so
# this costs image size nothing; what it cost was compiling 2,477 lines on
# every kernel build to satisfy nothing.
#
# They are still checked for Xtensa, by `make check-all` walking the whole
# workspace -- now called from the Xtensa CI job, because being pulled in here
# is what used to give them that coverage.
esp32-uart = { path = "../drivers/physical/esp32/uart", optional = true }

# Two more the kernel genuinely uses: `watchdog` feeds them and `rng` is
# re-exported. Both were modules of `soc-esp32` until peripherals were
# separated from chip infrastructure.
esp32-wdt = { path = "../drivers/physical/esp32/wdt", optional = true }
esp32-rng = { path = "../drivers/physical/esp32/rng", optional = true }

# Available on both host and target when the ESP32 SoC is selected:
# `heap::is_dma_capable` uses the same DMA-window definition in host tests and
# on hardware. Making the dependency optional keeps that chip-specific window
# out of another SoC's graph without reintroducing a hand-written copy.
soc-esp32 = { path = "../soc/esp32", optional = true }

# Xtensa support is target-only, and that is what lets this crate be built —
# and therefore tested — on a host at all.
#
# `arch-xtensa` carries `#![feature(asm_experimental_arch)]`, so it needs
# nightly; CI runs stable, where that is E0554. As a plain dependency it would
# be built for every host target even though `src/arch.rs` never names it
# there, and the kernel's own unit tests would go on running nowhere. Scoped to
# `target_os = "none"`, Cargo simply does not build it for the host, and the
# stand-ins in `arch::host` take its place.
[target.'cfg(target_os = "none")'.dependencies]
arch-xtensa = { path = "../arch/xtensa", optional = true }
# Target-only: it calls ROM routines at fixed addresses and runs with the
# instruction cache off, neither of which means anything on a host.
esp32-flash = { path = "../drivers/physical/esp32/flash", optional = true }
# Driven by the on-target self-tests; not used by the kernel proper.
esp32-timg = { path = "../drivers/physical/esp32/timg", optional = true }
esp32-adc = { path = "../drivers/physical/esp32/adc", optional = true }
# The DAC↔ADC2 shared-pad loopback self-test drives both.
esp32-dac = { path = "../drivers/physical/esp32/dac", optional = true }
esp32-adc2 = { path = "../drivers/physical/esp32/adc2", optional = true }
# The TWAI self-test loopback.
esp32-twai = { path = "../drivers/physical/esp32/twai", optional = true }
# The I2S DMA loopback.
esp32-i2s = { path = "../drivers/physical/esp32/i2s", optional = true }
# The PCNT self-test: counts software-toggled edges routed back through the
# matrix. `esp32-gpio` drives the pulse pad in software; the two only appear in
# the on-target self-test, not the kernel proper.
esp32-pcnt = { path = "../drivers/physical/esp32/pcnt", optional = true }
esp32-gpio = { path = "../drivers/physical/esp32/gpio", optional = true }
# The touch-sensor self-test reads a free touch pad's capacitance count.
esp32-touch = { path = "../drivers/physical/esp32/touch", optional = true }
# The MCPWM self-test drives a complementary pair and counts its edges with
# PCNT; the two only appear together in the on-target self-test.
esp32-mcpwm = { path = "../drivers/physical/esp32/mcpwm", optional = true }
# The SPI-bus (Layer 2) loopback self-test drives the wrapper over this driver.
esp32-spi = { path = "../drivers/physical/esp32/spi", optional = true }
spi-bus = { path = "../drivers/bus/spi-bus", optional = true }
# The SHA/AES accelerator self-test drives this and cross-checks it against the
# software `crypto` lib below.
esp32-crypto = { path = "../drivers/physical/esp32/crypto", optional = true }
# The reference the hardware crypto is checked against (#33). Software-only and
# host-testable, so it could be unconditional, but it is only ever named by the
# target-scoped self-test, so it lives here beside its one user.
crypto = { path = "../lib/crypto", optional = true }

[features]
# Board selection forwards straight through to `board` (see board/src/lib.rs
# for the "exactly one" enforcement). This is the crate users actually build,
# so board selection happens here:
#
#   cargo build -p kernel --features board-esp32-devkitc
#   cargo build -p kernel --features board-m5-atom-lite
#
# With no board the build fails and names the choices, which is the intended
# behaviour -- see below.
# No default board, deliberately. A default is a board you flash without
# choosing it, and the one that used to be here was the least tested board in
# the tree -- `make flash` with no argument built for hardware nobody had held.
# Selecting a board is one word on the command line; getting it silently wrong
# costs a debugging session against the wrong pin map.
default = ["arch-xtensa", "soc-esp32"]
arch-xtensa = ["dep:arch-xtensa"]
arch-armv6m = []
soc-esp32 = [
    "dep:board",
    "dep:soc-esp32",
    "dep:esp32-uart",
    "dep:esp32-wdt",
    "dep:esp32-rng",
    "dep:esp32-flash",
    "dep:esp32-timg",
    "dep:esp32-adc",
    "dep:esp32-dac",
    "dep:esp32-adc2",
    "dep:esp32-twai",
    "dep:esp32-i2s",
    "dep:esp32-pcnt",
    "dep:esp32-gpio",
    "dep:esp32-touch",
    "dep:esp32-mcpwm",
    "dep:esp32-spi",
    "dep:spi-bus",
    "dep:esp32-crypto",
    "dep:crypto",
]
soc-rp2040 = []
board-esp32-wrover = ["arch-xtensa", "soc-esp32", "board/board-esp32-wrover"]
board-esp32-devkitc = ["arch-xtensa", "soc-esp32", "board/board-esp32-devkitc"]
board-m5-atom-lite = ["arch-xtensa", "soc-esp32", "board/board-m5-atom-lite"]
board-m5-atom-matrix = ["arch-xtensa", "soc-esp32", "board/board-m5-atom-matrix"]
# Retired; forwards so `board` can print which of the two to use.
board-m5-atom = ["board/board-m5-atom"]

# ── Radios ──────────────────────────────────────────────────────────────────
# `radio-bt` is what the DRAM reservation is keyed on, because the reservation
# is the same for every Bluetooth mode. It is turned on by a mode rather than
# selected directly; see kernel/src/radio.rs.
radio-wifi = []
radio-bt = []
radio-ble = ["radio-bt"]
radio-bt-classic = ["radio-bt"]

debug-level-0 = []
debug-level-1 = ["flint-log", "flint-metrics", "flint-panic"]
debug-level-2 = ["debug-level-1", "flint-trace"]
debug-level-3 = ["debug-level-2", "flint-timing", "flint-cpu-util"]

# Debug features forward to `api` so the gated macros in user/kernel code
# actually emit (plan W7.3). Without this, enabling logging on the kernel had no
# effect because `api`'s own feature stayed off.
flint-log = ["api/flint-log"]
flint-metrics = ["api/flint-metrics"]
flint-panic = ["api/flint-panic"]
flint-trace = ["api/flint-trace"]
flint-timing = ["api/flint-timing"]
flint-cpu-util = ["api/flint-cpu-util"]

# Boot-time self-test: drives a deep windowed recursion after interrupts are
# unmasked and checks the result, so a trap that corrupts the interrupted
# task's register windows fails the boot loudly. Off by default; turn it on
# with `make build DEBUG=debug-level-1 EXTRA_FEATURES=self-test`.
self-test = []
