<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" role="img" aria-label="A terminal showing flintOS booting on an ESP32: build, flash, self-tests passing, and three preemptive tasks running.">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2029"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd884"/>
      <stop offset="0.55" stop-color="#f5951f"/>
      <stop offset="1" stop-color="#e15c07"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-size: 13px; }
      .dim   { fill: #6b7385; }
      .base  { fill: #c3cad8; }
      .bright{ fill: #eef1f7; }
      .amber { fill: #ffd884; }
      .ember { fill: #f5951f; }
      .green { fill: #4fd18b; }
      .blue  { fill: #7aa2f7; }
      .hex   { fill: #96a0b5; }
    </style>
  </defs>

  <!-- subtle ember halo behind the window -->
  <rect x="70" y="60" width="480" height="320" rx="40" fill="url(#ember)" opacity="0.10" filter="url(#glow)"/>

  <!-- window -->
  <rect x="18" y="16" width="584" height="398" rx="12" fill="url(#win)" stroke="#2c313e" stroke-width="1"/>
  <!-- title bar -->
  <path d="M18 28 a12 12 0 0 1 12 -12 h560 a12 12 0 0 1 12 12 v20 h-584 z" fill="#242936"/>
  <circle cx="40"  cy="38" r="6" fill="#ff5f57"/>
  <circle cx="60"  cy="38" r="6" fill="#febc2e"/>
  <circle cx="80"  cy="38" r="6" fill="#28c840"/>
  <text x="310" y="42" text-anchor="middle" class="mono dim" font-size="12">esp32-devkitc — make flash</text>

  <!-- body -->
  <g class="mono">
    <!-- command -->
    <text x="34" y="82"><tspan class="ember">$</tspan><tspan class="bright"> make flash BOARD=board-esp32-devkitc</tspan></text>
    <text x="34" y="104" class="dim">    Finished `dev` profile in 3.82s</text>
    <text x="34" y="126" class="dim">    Flashing 150 KiB over serial @ 921600 baud</text>

    <!-- boot banner -->
    <text x="34" y="154"><tspan class="dim">[FLINT] </tspan><tspan class="base">VECBASE=</tspan><tspan class="hex">0x40080000</tspan><tspan class="green"> MATCH </tspan><tspan class="base">(vectors in)</tspan></text>
    <text x="34" y="176"><tspan class="dim">[FLINT] </tspan><tspan class="base">cpu_hz=</tspan><tspan class="hex">240000000</tspan><tspan class="dim"> (measured: CCOUNT vs RTC)</tspan></text>
    <text x="34" y="198"><tspan class="dim">[FLINT] </tspan><tspan class="base">task_stack_pool=</tspan><tspan class="hex">[0x3ffc0000,0x3ffd8000)</tspan></text>

    <!-- self-test -->
    <text x="34" y="226"><tspan class="dim">[FLINT] TEST </tspan><tspan class="base">light_sleep_wakes_and_the_tick_catches_up</tspan><tspan class="green">  PASS</tspan></text>
    <text x="34" y="248"><tspan class="dim">[FLINT] TEST </tspan><tspan class="base">a_dynamic_queue_round_trips_on_hardware  </tspan><tspan class="green">PASS</tspan></text>
    <text x="34" y="270"><tspan class="dim">[FLINT] TEST </tspan><tspan class="base">hw_sha256_matches_software               </tspan><tspan class="green">PASS</tspan></text>
    <text x="34" y="292"><tspan class="dim">[FLINT] </tspan><tspan class="base">SELFTEST END  </tspan><tspan class="green">pass=50</tspan><tspan class="base"> fail=0</tspan></text>

    <!-- preemptive tasks running -->
    <text x="34" y="320"><tspan class="dim">[    2]</tspan><tspan class="amber">[sensor]    </tspan><tspan class="blue">INFO </tspan><tspan class="base"> prio=Normal(1)     n=1</tspan></text>
    <text x="34" y="342"><tspan class="dim">[    5]</tspan><tspan class="amber">[consumer]  </tspan><tspan class="blue">INFO </tspan><tspan class="base"> prio=Normal(5)     n=1</tspan></text>
    <text x="34" y="364"><tspan class="dim">[  505]</tspan><tspan class="amber">[sensor]    </tspan><tspan class="blue">INFO </tspan><tspan class="base"> prio=Normal(1)     n=2</tspan></text>
    <text x="34" y="386"><tspan class="dim">[ 3010]</tspan><tspan class="amber">[housekeep] </tspan><tspan class="blue">INFO </tspan><tspan class="base"> prio=Background(1) n=1</tspan></text>
  </g>
</svg>
