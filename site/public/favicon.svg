  <!-- secondary ember spark -->
  <path fill="#ffc266"
        d="M23.6 20.4C23.9 23 24.7 23.8 27.3 24.1 24.7 24.4 23.9 25.2 23.6 27.8 23.3 25.2 22.5 24.4 19.9 24.1 22.5 23.8 23.3 23 23.6 20.4Z"/>
