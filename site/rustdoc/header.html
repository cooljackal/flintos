<!--
  flintOS rustdoc skin. Injected into every rustdoc page via
  `RUSTDOCFLAGS=--html-in-header` (see the `docs` target in the Makefile), so the
  generated API reference reads as the same product as the flintos.dev site:
  IBM Plex fonts and the site's accent, dark by default.

  The fonts are the same self-hosted woff2 the Starlight site ships in
  site/public/fonts/, served same-origin at /fonts/ under flintos.dev/api. This
  <style> is inserted at the END of <head>, after rustdoc's own theme sheets, so
  its rules win on equal specificity without needing !important.
-->
<style>
@font-face {
	font-family: "IBM Plex Sans";
	font-style: normal;
	font-weight: 400;
	font-display: swap;
	src: url("/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
}
@font-face {
	font-family: "IBM Plex Sans";
	font-style: normal;
	font-weight: 600;
	font-display: swap;
	src: url("/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2");
}
@font-face {
	font-family: "IBM Plex Mono";
	font-style: normal;
	font-weight: 400;
	font-display: swap;
	src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
}

/* Match the site's link/nav accent (slate #6c8cff dark, #3a55d9 light). rustdoc
   keys links off --link-color per theme; overriding it here covers all themes. */
:root,
:root[data-theme="dark"],
:root[data-theme="ayu"] {
	--link-color: #6c8cff;
}
:root[data-theme="light"] {
	--link-color: #3a55d9;
}

/* Body text in Plex Sans; code and the doc's code blocks in Plex Mono. rustdoc's
   defaults are Source Serif 4 / Source Code Pro -- replace the whole stack so a
   missing weight falls back to the system UI/mono, never back to serif. */
body,
.rustdoc {
	font-family: "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont,
		"Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
code, pre, kbd,
.example-wrap pre, .rustdoc.source .example-wrap pre,
pre.rust, .code-header, .item-decl code, .rustdoc pre code {
	font-family: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular,
		Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
}

/* Headings a touch tighter, like the site's -0.02em display type. */
h1, h2, h3, .rustdoc h1, .rustdoc h2 {
	letter-spacing: -0.015em;
}
</style>
