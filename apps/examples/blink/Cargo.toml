[package]
name = "blink"
publish = false
version.workspace = true
edition.workspace = true
description = "Drives the M5Stack Atom's onboard addressable LED over RMT"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }

# The board opens Layer 1 now: `board::led_rmt()` claims the RMT channel, gates
# the clock, routes the signal and enables the pad, and re-exports the RMT types
# this app threads through it. So this app names no SoC crate and no physical
# driver -- only the board and the portable layers above it.
#
#   board        opens the RMT channel on the LED pin (Layer 1, owned by the board)
#   ws2812       layer 3  the wire protocol, which knows about no chip at all
#   led-matrix   the panel geometry, a portable library
board = { path = "../../../board" }
ws2812 = { path = "../../../drivers/logical/ws2812" }
led-matrix = { path = "../../../lib/led-matrix" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board, debug level and radio mode are chosen on the command line and passed
# straight to the kernel (`--features kernel/board-m5-atom-matrix,kernel/debug-level-2`),
# so this manifest no longer forwards them -- see #120. `blink` needs an Atom
# board (only they declare an addressable LED); building it for any other board
# is caught by a `const` assert in `main.rs` keyed on the board's name, which
# names the board that is needed rather than leaving cargo to complain about a
# missing feature.
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_RADIO_BT to size the DRAM map. Turn a mode on
# with `--features kernel/radio-ble,radio-bt`.
radio-bt = []

