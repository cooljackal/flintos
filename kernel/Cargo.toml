[package]
name = "flint-kernel"
version.workspace = true
edition.workspace = true
description = "Flint RTOS kernel — scheduler, IPC, debug subsystems"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flint-hal = { path = "../hal" }
flint-api = { path = "../api" }
flint-arch-xtensa = { path = "../arch/xtensa" }
flint-board = { path = "../board", default-features = false }

# Physical drivers
esp32-uart = { path = "../drivers/physical/esp32-uart" }
esp32-gpio = { path = "../drivers/physical/esp32-gpio" }
esp32-spi  = { path = "../drivers/physical/esp32-spi" }
esp32-i2c  = { path = "../drivers/physical/esp32-i2c" }

# Bus abstractions
spi-bus   = { path = "../drivers/bus/spi-bus" }
i2c-bus   = { path = "../drivers/bus/i2c-bus" }
uart-bus  = { path = "../drivers/bus/uart-bus" }

# Logical drivers
bme280  = { path = "../drivers/logical/bme280" }
ssd1306 = { path = "../drivers/logical/ssd1306" }

[features]
# Board selection forwards straight through to flint-board (see
# board/src/lib.rs for the "exactly one" enforcement). This is the crate
# users actually build, so board selection happens here. `board-esp32-wrover`
# is a default feature, so switching boards needs --no-default-features or
# the default and the requested board both stay enabled and flint-board's
# compile_error! rejects the build:
#
#   cargo build -p flint-kernel   # default: board-esp32-wrover
#   cargo build -p flint-kernel --no-default-features --features board-m5-atom
#   cargo build -p flint-kernel --no-default-features --features board-esp32-devkitc
default = ["board-esp32-wrover"]
board-esp32-wrover = ["flint-board/board-esp32-wrover"]
board-esp32-devkitc = ["flint-board/board-esp32-devkitc"]
board-m5-atom = ["flint-board/board-m5-atom"]

debug-level-0 = []
debug-level-1 = ["flint-log", "flint-metrics", "flint-panic"]
debug-level-2 = ["debug-level-1", "flint-trace"]
debug-level-3 = ["debug-level-2", "flint-timing", "flint-cpu-util"]

# Debug features forward to flint-api so the gated macros in user/kernel code
# actually emit (plan W7.3). Without this, enabling logging on the kernel had no
# effect because flint-api's own feature stayed off.
flint-log = ["flint-api/flint-log"]
flint-metrics = ["flint-api/flint-metrics"]
flint-panic = ["flint-api/flint-panic"]
flint-trace = ["flint-api/flint-trace"]
flint-timing = ["flint-api/flint-timing"]
flint-cpu-util = ["flint-api/flint-cpu-util"]

# Boot-time self-test: drives a deep windowed recursion after interrupts are
# unmasked and checks the result, so a trap that corrupts the interrupted
# task's register windows fails the boot loudly. Off by default; turn it on
# with `make build DEBUG=debug-level-1 EXTRA_FEATURES=phase0-tests`.
phase0-tests = []
