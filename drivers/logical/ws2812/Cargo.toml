[package]
name = "ws2812"
publish = false
version.workspace = true
edition.workspace = true
description = "WS2812 / SK6812 addressable LED driver"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Nothing here names `api`: this crate is pure encoding. Left declared
# because the layer check treats it as the one permitted dependency, and
# a driver that needs a queue or a log later will want it.
api = { path = "../../../api" }

# The device class this chip belongs to. A logical driver may depend on
# lib/ crates, which is what lets the contract live above the part number.
led-strip = { path = "../../../lib/led-strip" }
