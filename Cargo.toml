[workspace]
resolver = "2"
# Package names carry no prefix, because nothing here is published. FlintOS is
# not a pure-Rust library -- it ships a linker script and a flashed image
# alongside the crates -- so it will never go to crates.io, and a package name
# therefore only has to be unique within this workspace. Every package sets
# `publish = false` directly under its `name`, and that is what keeps the short
# names honest: an unprefixed `hal` or `bme280` would otherwise be a standing
# claim on a crates.io name that is not ours to make (`bme280` and `ssd1306`
# are both well-known third-party driver crates already).
#
# A package's name is its directory leaf. The category directories -- `tools/`,
# `apps/`, `drivers/physical/`, `drivers/logical/`, `drivers/bus/` -- scope the
# path but contribute nothing to the name:
#
#     hal/                          -> hal
#     tools/build/                  -> build
#     tools/size/                   -> size
#     apps/examples/demo/           -> demo
#     drivers/logical/bme280/       -> bme280
#     lib/led-matrix/               -> led-matrix
#
# Some packages fold their category word into the name, because the bare leaf
# names something far larger than the crate -- `xtensa` is an instruction set
# and `esp32` a whole chip family -- and a dependency line shows the name
# without the path that would have disambiguated it:
#
#     arch/xtensa/                  -> arch-xtensa
#     soc/esp32/                    -> soc-esp32
#
# Layer-1 drivers are grouped by the SoC they are bound to, and take the same
# form. The directory says what the name already claimed, and a bare `uart`
# would be a standing claim on a name that means nothing on its own:
#
#     drivers/physical/esp32/uart/  -> esp32-uart
#     drivers/physical/esp32/i2c/   -> esp32-i2c
#
# Cargo *feature* names are a separate namespace and do keep the prefix:
# `flint-log` and the like are written on a
# dependency line, where they sit among features belonging to other crates.
members = [
    "hal",
    "api",
    "arch/xtensa",
    "arch/armv6m",
    "soc/esp32",
    "soc/rp2040",
    "kernel",
    "board",
    "tools/build",
    "tools/size",
    "tools/apidoc",

    # Applications. The kernel is a library; an application is the binary that
    # links it. Two directories: `examples/` is what a newcomer reads or
    # copies, `tests/` is the on-target verification workloads with a
    # PASS/FAIL contract. Dropping a crate into either is all that is needed
    # for `make APP=<name>`.
    "apps/examples/*",
    "apps/tests/*",

    "drivers/physical/esp32/uart",
    "drivers/physical/esp32/gpio",
    "drivers/physical/esp32/spi",
    "drivers/physical/esp32/i2c",
    "drivers/physical/esp32/ledc",
    "drivers/physical/esp32/rmt",
    "drivers/physical/esp32/wdt",
    "drivers/physical/rp2040/gpio",
    "drivers/physical/rp2040/uart",
    "drivers/physical/esp32/rng",
    "drivers/physical/esp32/crypto",
    "drivers/physical/esp32/timg",
    "drivers/physical/esp32/adc",
    "drivers/physical/esp32/adc2",
    "drivers/physical/esp32/dac",
    "drivers/physical/esp32/twai",
    "drivers/physical/esp32/i2s",
    "drivers/physical/esp32/pcnt",
    "drivers/physical/esp32/touch",
    "drivers/physical/esp32/mcpwm",
    "drivers/physical/esp32/flash",
    "drivers/physical/esp32/_template",
    "drivers/bus/spi-bus",
    "drivers/bus/i2c-bus",
    "drivers/logical/axp192",
    "drivers/logical/bme280",
    "drivers/logical/bmi270",
    "drivers/logical/ft6336u",
    "drivers/logical/ili9342c",
    "drivers/logical/mpu6886",
    "drivers/logical/ssd1306",
    "drivers/logical/ws2812",

    # Portable libraries. Not drivers: they touch no register, name no part
    # number, and their output is a value rather than something destined for a
    # pin. `led-matrix` turns (x, y) into an integer and depends on nothing at
    # all. Filing that under `drivers/` would have been a false statement, and
    # the Layer-3 naming convention would have handed it the name
    # `driver-led-matrix` to make the claim out loud.
    "lib/led-matrix",
    "lib/kvstore",
    "lib/heap",
    "radio/esp32",
    "lib/led-strip",
    "lib/crypto",
    "lib/wpa",
]

# Shared metadata. Every member inherits these with `field.workspace = true`
# so version and licence stay in lock-step across every crate.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Farhan Husain <cooljackal@gmail.com>"]
repository = "https://github.com/cooljackal/flintos"
rust-version = "1.86"

# ── Build profiles ────────────────────────────────────────────────────────────
#
# `panic = "abort"` matches the kernel's own #[panic_handler]: there is no
# unwinder on bare metal, and no allocator to support one. Cargo ignores this
# setting for the test/bench profiles, so host-side `cargo test` still works.

[profile.dev]
# opt-level 0 produces very large stack frames on Xtensa -- the trap handler
# alone reserves 272 bytes, and it runs on the *interrupted task's* stack. At
# opt-level 1 frames shrink enough for the 4 KiB default task stack to hold a
# trap plus the calls it makes, while debug info stays fully intact.
opt-level = 1
debug = true
panic = "abort"

[profile.release]
opt-level = "z"     # size is the binding constraint on a 4 MB flash part
lto = true
codegen-units = 1
debug = true        # symbols stay in the ELF; espflash strips them for the image
panic = "abort"
