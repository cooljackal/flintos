# SPDX-License-Identifier: Apache-2.0

[package]
name = "hello"
publish = false
version.workspace = true
edition.workspace = true
description = "Flint demo application — one task, logging on a timer"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../kernel", default-features = false }
api = { path = "../../api" }
hal = { path = "../../hal" }

[build-dependencies]
build = { path = "../../tools/build" }

# Board and debug selection are the application's, not the kernel's: the
# application is the binary, so it is the only place a feature can be chosen
# without leaking into every other crate that links the kernel. Each one
# forwards straight through.
#
#   cargo build -p hello                                            # WROVER
#   cargo build -p hello --no-default-features --features board-m5-atom,debug-level-1
[features]
default = ["board-esp32-wrover", "debug-level-1"]

board-esp32-wrover = ["kernel/board-esp32-wrover"]
board-esp32-devkitc = ["kernel/board-esp32-devkitc"]
board-m5-atom-lite = ["kernel/board-m5-atom-lite"]
board-m5-atom-matrix = ["kernel/board-m5-atom-matrix"]
board-m5-atom = ["kernel/board-m5-atom"]

debug-level-0 = ["kernel/debug-level-0"]
debug-level-1 = ["kernel/debug-level-1"]
debug-level-2 = ["kernel/debug-level-2"]
debug-level-3 = ["kernel/debug-level-3"]

# Boot-time register-window self-test. Off by default; `make ... EXTRA_FEATURES=self-test`.
self-test = ["kernel/self-test"]
