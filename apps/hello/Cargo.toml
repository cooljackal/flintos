# SPDX-License-Identifier: Apache-2.0

[package]
name = "hello"
# Unprefixed by exception, not oversight -- see apps/demo/Cargo.toml.
publish = false
version.workspace = true
edition.workspace = true
description = "Flint demo application — one task, logging on a timer"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flint-kernel = { path = "../../kernel", default-features = false }
flint-api = { path = "../../api" }
flint-hal = { path = "../../hal" }

[build-dependencies]
flint-build = { path = "../../tools/build" }

# Board and debug selection are the application's, not the kernel's: the
# application is the binary, so it is the only place a feature can be chosen
# without leaking into every other crate that links the kernel. Each one
# forwards straight through.
#
#   cargo build -p hello                                            # WROVER
#   cargo build -p hello --no-default-features --features board-m5-atom,debug-level-1
[features]
default = ["board-esp32-wrover", "debug-level-1"]

board-esp32-wrover = ["flint-kernel/board-esp32-wrover"]
board-esp32-devkitc = ["flint-kernel/board-esp32-devkitc"]
board-m5-atom = ["flint-kernel/board-m5-atom"]

debug-level-0 = ["flint-kernel/debug-level-0"]
debug-level-1 = ["flint-kernel/debug-level-1"]
debug-level-2 = ["flint-kernel/debug-level-2"]
debug-level-3 = ["flint-kernel/debug-level-3"]

# Boot-time register-window self-test. Off by default; `make ... EXTRA_FEATURES=phase0-tests`.
phase0-tests = ["flint-kernel/phase0-tests"]
