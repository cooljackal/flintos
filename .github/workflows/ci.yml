# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three pushes to a PR should not run three full matrices; the later one carries
# the newer code and wins. Keyed by ref so a PR never cancels main's run.
# `wiki.yml` has done this since it was written -- this file had not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The repo's .cargo/config.toml defaults to the Xtensa target and enables
  # build-std. Host jobs must therefore pass --target explicitly to override it.
  HOST_TARGET: x86_64-unknown-linux-gnu
  # Pinned rather than "latest": this is the Xtensa toolchain cache key, so an
  # unpinned version would silently re-download ~1 GB whenever espup released.
  ESPUP_VERSION: "0.17.1"
  # The esp Rust toolchain espup installs. Pinned to the version the workspace
  # is developed and tested against, not espup's default: the default resolved
  # to a toolchain that could not build `portable-atomic 1.15.0` (the ARM port's
  # atomics dep), failing the xtensa check with a spurious `can't find crate for
  # core`. Bump this and the local toolchain together.
  ESP_TOOLCHAIN_VERSION: "1.95.0.0"

jobs:
  check:
    name: Check and test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # No dependency cache here on purpose. Every package in this workspace is
      # a path member -- `Cargo.lock` carries zero `source =` and zero
      # `checksum =` entries -- and rust-cache does not cache workspace crates
      # themselves. It would restore an empty registry and a target dir stripped
      # of everything this build produces, then pay to save it again.

      # Both steps below go through `make`, which owns the one definition of
      # which crates build on the host (`HOST_SELECT` in the Makefile). This
      # file used to carry three more copies of that list, and a fourth lived
      # in the Makefile; every crate added or renamed had to edit all four,
      # with nothing failing if one was missed.
      #
      # -D warnings via RUSTFLAGS is safe for host jobs and only for host jobs:
      # .cargo/config.toml sets rustflags for the Xtensa target only, and
      # RUSTFLAGS replaces config rustflags rather than adding to them. Setting
      # it globally would silently drop the linker script and -mlongcalls from
      # the ESP32 build, which fails at link time with no hint as to why.
      #
      # There is no separate `cargo check` step: clippy is a check-mode pass
      # over lib, bins and tests, so it compiles a superset of what `check`
      # did and fails on the same errors a moment sooner.
      #
      # --all-targets (in `make lint`) so test code is linted too. Tests are
      # where lints accumulate: they are written fast and read rarely.
      - name: Clippy (lib, bins and tests)
        env:
          RUSTFLAGS: -D warnings
        run: make lint

      - name: Run host unit tests
        env:
          RUSTFLAGS: -D warnings
        run: make test-host

  # Both checks are structural: they read `cargo metadata` and assert something
  # about the shape of the workspace that no compiler error would catch. They
  # share a job because each takes about a second, and a runner costs a billed
  # minute either way.
  structure:
    name: Workspace structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce the Layer-3 to Layer-1 dependency boundary
        run: make check-layers
      - name: Enforce the package naming and layout convention
        run: make check-names

      # The on-target suite itself needs a board and so cannot run here, but the
      # logic that decides whether a board passed is just text handling, and it
      # is the part that would otherwise go unchecked until it mattered.
      - name: The on-target harness judges a run correctly
        run: make test-harness

  licence:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every source file carries an SPDX identifier
        run: |
          missing=0
          for f in $(git ls-files '*.rs' '*.S' '*.ld' '*.sh') Makefile; do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "::error file=$f::missing SPDX-License-Identifier header"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "$missing file(s) missing an SPDX header. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All source files carry an SPDX header."

  changelog:
    name: Changelog for API changes
    runs-on: ubuntu-latest
    # PR-only, like the DCO check: this is a review-time obligation, and on a
    # push to main there is no reliable base to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # An application compiles against api/, hal/ and board/. A change there
      # can break code in a repository we cannot see, and the only way its
      # author learns what to do is this file.
      - name: A change to the application-facing API is described in CHANGELOG.md
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")

          if ! echo "$changed" | grep -qE '^(api|hal|board)/'; then
            echo "No application-facing crate touched; nothing to describe."
            exit 0
          fi

          echo "Touched by this PR:"
          echo "$changed" | grep -E '^(api|hal|board)/' | sed 's/^/  /'

          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi

          echo "::error::This PR changes api/, hal/ or board/ but does not touch CHANGELOG.md. Applications compile against those crates, so a change here can break code in a repository nobody on this PR can see. Add an entry saying what to do about it -- under Breaking if it is. If the change genuinely cannot affect an application, say so in the Added or Fixed section rather than skipping the file."
          exit 1

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit in this PR is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          for sha in $(git rev-list "$base..$head"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit $sha is not signed off by its author ($author)"
              echo "  fix with: git rebase --signoff $base"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed commit(s) missing a DCO sign-off. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed off."

  xtensa:
    name: Build for ESP32 (Xtensa)
    runs-on: ubuntu-latest
    # This job used to be `continue-on-error: true` because the toolchain
    # install was slow and occasionally flaky. The cache below fixed the slow
    # part, and the flag then hid a real failure for weeks: `make check-all`
    # was failing on every run with `can't find crate for core` because the
    # ARM target was never installed, and the app loop was building
    # arm-selftest for an ESP32 board it does not declare -- both red, both
    # reported green. A check that cannot fail is not a check. If the install
    # flakes, re-run the job.
    steps:
      - uses: actions/checkout@v7

      # The Xtensa toolchain is ~1 GB of LLVM and rustc. Downloading it on every
      # push was the most expensive thing in this workflow. Keyed on the espup
      # version, so a bump below is what invalidates it.
      - name: Cache the Espressif toolchain
        id: esp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.espressif
            ~/export-esp.sh
          key: esp-${{ runner.os }}-espup-${{ env.ESPUP_VERSION }}-rust-${{ env.ESP_TOOLCHAIN_VERSION }}

      # espup publishes prebuilt binaries. `cargo install espup --locked`
      # compiled it from source on every run -- minutes of CPU to produce a
      # binary its own release page already has.
      - name: Install the Espressif Rust toolchain
        if: steps.esp-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/espup \
            "https://github.com/esp-rs/espup/releases/download/v${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu"
          chmod +x /tmp/espup
          /tmp/espup install --toolchain-version "${ESP_TOOLCHAIN_VERSION}"

      # `make check-all` ends with `cargo check --target thumbv6m-none-eabi -p
      # arm-selftest` on the *default* (stable) toolchain, not the esp one --
      # the ARM port builds with stock Rust and a prebuilt core. That target is
      # not on the runner by default, and without it the step fails before
      # compiling a line.
      - name: Install the ARM target for the stable toolchain
        run: rustup target add thumbv6m-none-eabi

      # Every crate, not just the applications. The kernel names exactly one
      # driver (the console UART), so building an application reaches only that
      # one -- the other eight drivers would be checked for the host and never
      # for Xtensa, and a target-specific break in them would land silently.
      - name: Check every crate for Xtensa and ARM
        run: |
          . "$HOME/export-esp.sh"
          make check-all

      # Clippy for Xtensa, across the feature combinations that gate real code.
      # `make lint` runs on the host, and anything behind `target_os = "none"`
      # -- the whole of arch-xtensa, the trap handler, the self-test suite --
      # is invisible to it however the features are set. This is the only job
      # that lints that code. When it was first run it found twenty missing
      # safety docs and a trap handler taking a raw pointer without being
      # `unsafe`, none of which any other check could see.
      - name: Lint Xtensa-only code and non-default features
        run: |
          . "$HOME/export-esp.sh"
          make check-features BOARD=board-esp32-devkitc

      # Build every application, not just one. An app carries its own
      # build.rs and feature pass-through, so a broken one is invisible to a
      # build of any other.
      #
      # Warnings fail this job too, but by inspecting the output rather than by
      # setting RUSTFLAGS: the Xtensa target's rustflags in .cargo/config.toml
      # carry the linker script and -mlongcalls, and RUSTFLAGS *replaces* config
      # rustflags rather than adding to them. Setting it here fails the link
      # with no hint as to why.
      - name: Build every application image
        run: |
          . "$HOME/export-esp.sh"
          # Every application names a board, because none is a default any more.
          # blink, imu and pwm drive hardware only the Atoms declare and refuse
          # any other manifest; arm-selftest is the RP2040 suite and declares
          # only the Wio, so it builds for thumbv6m on the stable toolchain
          # (installed above) instead of for Xtensa; the rest build against the
          # board the on-target suite is verified on.
          status=0
          for app in apps/examples/*/ apps/tests/*/; do
            name=$(basename "$app")
            case "$name" in
              blink|imu|pwm) board=board-m5-atom-matrix ;;
              arm-selftest)  board=board-wio-rp2040-mini ;;
              *)             board=board-esp32-devkitc ;;
            esac
            if [ "$name" = arm-selftest ]; then
              build=(cargo build --target thumbv6m-none-eabi)
            else
              build=(cargo +esp build --target xtensa-esp32-none-elf
                     -Z build-std=core,compiler_builtins)
            fi
            echo "::group::$name ($board)"
            set -o pipefail
            # Board and debug level are kernel features passed on the command
            # line now (#120); no app manifest forwards them any more.
            "${build[@]}" \
              -p "$name" --no-default-features \
              --features "kernel/$board,kernel/debug-level-1" 2>&1 | tee "build-$name.log" || status=1
            set +o pipefail
            echo "::endgroup::"
            # `warning: N warnings emitted` is a summary line, not a warning.
            if grep -E '^warning' "build-$name.log" | grep -qv 'generated .* warning'; then
              echo "::error::$name built with warnings"
              grep -E '^warning' "build-$name.log"
              status=1
            fi
          done
          exit "$status"
