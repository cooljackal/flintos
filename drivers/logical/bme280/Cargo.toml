[package]
name = "bme280"
publish = false
version.workspace = true
edition.workspace = true
description = "BME280 temperature/humidity/pressure sensor logical driver (Layer 3)"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Layer-3 drivers depend ONLY on `api` (plan W7.1). Depending on `hal` or
# `arch-*` here is a layer violation — checked by tools/check-layers.sh.
api = { path = "../../../api" }
