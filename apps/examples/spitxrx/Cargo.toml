[package]
name = "spitxrx"
publish = false
version.workspace = true
edition.workspace = true
description = "SPI loopback through the Layer-2 Bus — the SPI porting template"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }

# The board opens Layer 1 and folds the loopback now: `board::loopback_spi()`
# hands back a ready `&'static SpiBus` and `board::fold_spi_loopback()` folds
# MISO onto the MOSI pad, so this app names no physical driver and no SoC crate.
# The bus is driven through the `api::bus::Bus` trait, so `spi-bus` need not be
# named either.
#
#   board       opens SPI2 on the loopback pads and folds MISO (owned by the board)
board = { path = "../../../board" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board, debug level and radio mode are chosen on the command line and passed
# straight to the kernel (`--features kernel/board-esp32-devkitc,kernel/debug-level-2`),
# so this manifest no longer forwards them -- see #120.
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_RADIO_BT to size the DRAM map. Turn a mode on
# with `--features kernel/radio-ble,radio-bt`.
radio-bt = []
