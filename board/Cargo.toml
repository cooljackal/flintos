[package]
name = "flint-board"
version.workspace = true
edition.workspace = true
description = "Flint RTOS board manifests — ESP32-WROVER, ESP32-DevKitC/WROOM-32, M5Stack ATOM (ESP32-PICO-D4)"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flint-hal = { path = "../hal" }
flint-soc-esp32 = { path = "../soc/esp32" }

# Board selection. Exactly one `board-*` feature must be enabled — see
# `src/lib.rs` for the compile_error! that enforces this. Selection lives
# here (Cargo features) rather than in an env var: features are visible to
# `cargo check`/IDEs, compose with `--no-default-features`, and can't be
# silently ignored the way the old `FLINT_BOARD` env var in
# `.cargo/config.toml` was (nothing ever read it).
[features]
default = ["board-esp32-wrover"]
board-esp32-wrover = []
board-esp32-devkitc = []
board-m5-atom = []
