# SPDX-License-Identifier: Apache-2.0

[package]
name = "wificonnect"
publish = false
version.workspace = true
edition.workspace = true
description = "Joins a WPA2 network with the first-party Rust supplicant and reports the result"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }
soc-esp32 = { path = "../../../soc/esp32" }
# The reason this application exists: the generalized station interface and the
# ESP32 backend that drives the first-party supplicant.
radio-esp32 = { path = "../../../radio/esp32" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
default = ["kernel/debug-level-1"]

# See wifiscan: link Espressif's archives. Off by default; the useful build is
#     FLINT_WIFI_SSID=.. FLINT_WIFI_PASS=.. make flash APP=wificonnect BOARD=.. EXTRA_FEATURES=blobs
blobs = []

# Board, debug level and radio mode are chosen on the command line and passed
# straight to the kernel (`--features kernel/board-esp32-devkitc,kernel/debug-level-2`),
# so this manifest no longer forwards them -- see #120. `radio-esp32` reads the
# selected board through the kernel (it declares no board `cfg` of its own), so
# `kernel/board-x` alone is enough.
#
# `radio-bt` stays: `build::link()` runs in *this* crate's build script and
# reads CARGO_FEATURE_RADIO_BT to size the DRAM map. Turn a mode on with
# `--features kernel/radio-ble,radio-bt`.
radio-bt = []
