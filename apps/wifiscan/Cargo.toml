# SPDX-License-Identifier: Apache-2.0

[package]
name = "wifiscan"
publish = false
version.workspace = true
edition.workspace = true
description = "Scans for access points with Espressif's Wi-Fi blob and prints what it found"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../kernel", default-features = false }
api = { path = "../../api" }
hal = { path = "../../hal" }

soc-esp32 = { path = "../../soc/esp32" }
# For the cache-off counters: every `nvs` read parks the second core, and
# whether it ever falls back to stalling it is the open question behind the
# init hang. See doc/plan-radio.md, "N2".
esp32-flash = { path = "../../drivers/physical/esp32/flash" }
# The reason this application exists.
radio-esp32 = { path = "../../radio/esp32" }

[build-dependencies]
build = { path = "../../tools/build" }

[features]
default = ["debug-level-1"]

# Link Espressif's archives and call into them. **Off by default, and the
# probe does nothing without it** -- `make check-all` and CI have no `.blobs/`
# directory, and `build::link()` fails loudly rather than quietly when the
# feature is on and the archives are absent. So the useful build is
#
#     make flash APP=wifiscan BOARD=... EXTRA_FEATURES=blobs
#
# and a build without it still flashes, prints why it can do nothing, and
# stops. The alternative -- implying this from the board feature -- would make
# a clean clone fail `make check-all` on a 4 MB download it never asked for.
blobs = []

board-m5-atom-lite = ["kernel/board-m5-atom-lite", "radio-esp32/board-m5-atom-lite"]
board-m5-atom-matrix = ["kernel/board-m5-atom-matrix", "radio-esp32/board-m5-atom-matrix"]
board-esp32-wrover = ["kernel/board-esp32-wrover", "radio-esp32/board-esp32-wrover"]
board-esp32-devkitc = ["kernel/board-esp32-devkitc", "radio-esp32/board-esp32-devkitc"]

debug-level-0 = ["kernel/debug-level-0"]
debug-level-1 = ["kernel/debug-level-1"]
debug-level-2 = ["kernel/debug-level-2"]
debug-level-3 = ["kernel/debug-level-3"]

# As in every other application: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_*, so the memory map keys off the
# application's own view of which radios are on.
radio-wifi = ["kernel/radio-wifi"]
radio-bt = []
radio-ble = ["radio-bt", "kernel/radio-ble"]
radio-bt-classic = ["radio-bt", "kernel/radio-bt-classic"]
