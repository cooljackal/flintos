# SPDX-License-Identifier: Apache-2.0

[package]
name = "hello"
publish = false
version.workspace = true
edition.workspace = true
description = "FlintOS demo application — one task, logging on a timer"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }

[build-dependencies]
build = { path = "../../../tools/build" }

# Board, debug level and radio mode are the kernel's, not the application's, and
# the build passes them through on the command line rather than the app
# declaring one feature per choice:
#
#   cargo build -p hello --no-default-features --features kernel/board-m5-atom,kernel/debug-level-1
#
# so the forwarding block that used to live here is gone (see #120). What stays
# below is what this application owns.
[features]
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_RADIO_BT to size the DRAM map, so the
# reservation keys off the application's own view of whether Bluetooth is
# linked. `--features kernel/radio-ble,radio-bt` turns the mode on and reserves.
radio-bt = []

# Boot-time register-window self-test. Off by default; `make ... EXTRA_FEATURES=self-test`.
self-test = ["kernel/self-test"]
