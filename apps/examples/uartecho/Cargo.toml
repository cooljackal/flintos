[package]
name = "uartecho"
publish = false
version.workspace = true
edition.workspace = true
description = "UART loopback through the Layer-2 Bus — the UART porting template"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }

# A UART is a stream, not a Bus, so there is no Layer-2 wrapper: the driver
# exposes `ByteStream` directly (see hal::stream). This composes Layer 1 with
# the stream API the app drives it through.
#
#   esp32-uart   Layer 1   the controller's registers, and its ByteStream
soc-esp32 = { path = "../../../soc/esp32" }
esp32-uart = { path = "../../../drivers/physical/esp32/uart" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board, debug level and radio mode are chosen on the command line and passed
# straight to the kernel (`--features kernel/board-esp32-devkitc,kernel/debug-level-2`),
# so this manifest no longer forwards them -- see #120.
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_RADIO_BT to size the DRAM map. Turn a mode on
# with `--features kernel/radio-ble,radio-bt`.
radio-bt = []
