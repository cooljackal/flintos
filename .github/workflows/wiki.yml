# SPDX-License-Identifier: Apache-2.0
name: Wiki

# The wiki is a separate git repo, so publishing is just a push to it. Doing
# that here rather than from a script means the wiki cannot drift from `main`:
# there is no step anyone can forget.
#
# Docs still live in `doc/wiki/` rather than being edited on the wiki directly,
# so they get reviewed in the same PR as the change that made them wrong, and a
# checkout carries its own documentation.
on:
  push:
    branches: [main]
    paths: ['doc/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

# Two runs pushing to the same wiki repo would race. Let the later one win
# rather than fail: it carries the newer docs.
concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Publish doc/wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync doc/wiki to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! git clone --quiet --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          then
            echo "::error::Cannot clone the wiki. GitHub does not create one until it has at least one page — open https://github.com/${GITHUB_REPOSITORY}/wiki, save any page, and re-run this workflow. The placeholder gets overwritten."
            exit 1
          fi

          # README.md documents the directory for people reading the repo. It is
          # not a wiki page, and publishing it would collide with the wiki's own
          # notion of a home page.
          for f in doc/wiki/*.md; do
            name=$(basename "$f")
            if [ "$name" != "README.md" ]; then
              cp "$f" "wiki/$name"
            fi
          done

          # Delete pages that no longer exist in source. Without this a renamed
          # page lingers on the wiki forever, and a stale doc is worse than a
          # missing one because nothing signals it is stale.
          for f in wiki/*.md; do
            name=$(basename "$f")
            if [ ! -f "doc/wiki/$name" ] || [ "$name" = "README.md" ]; then
              rm -f "$f"
              echo "removed stale page: $name"
            fi
          done

          cd wiki
          if [ -z "$(git status --porcelain)" ]; then
            echo "wiki already matches doc/wiki/"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit --quiet -m "docs: sync from doc/wiki/ (${GITHUB_SHA:0:7})"
          git push --quiet
          echo "published ${GITHUB_SHA:0:7} to the wiki"
