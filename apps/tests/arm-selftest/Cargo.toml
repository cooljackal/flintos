# SPDX-License-Identifier: Apache-2.0

[package]
name = "arm-selftest"
publish = false
version.workspace = true
edition.workspace = true
description = "RP2040 on-target kernel acceptance tests"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }
portable-atomic = { version = "=1.15.0", features = ["critical-section", "require-cas"] }
soc-rp2040 = { path = "../../../soc/rp2040" }
rp2040-uart = { path = "../../../drivers/physical/rp2040/uart" }
rp2040-gpio = { path = "../../../drivers/physical/rp2040/gpio" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board and debug level are chosen on the command line and passed straight to
# the kernel (`--features kernel/board-wio-rp2040-mini,kernel/debug-level-1`),
# so this manifest no longer forwards them -- see #120. What stays is what this
# test owns: the two variants of the on-target suite.
default = []
# The expected-hardfault variant, which faults on purpose to prove the handler
# catches it; forwards to the kernel's matching guard.
expected-hardfault = ["kernel/arm-expected-hardfault"]
# The minimal variant: fewer tests, for bring-up.
minimal = []
reset-recovery-smoke = ["kernel/rp2040-test-recovery"]
watchdog-reset = []
diagnostics-smoke = []
