# SPDX-License-Identifier: Apache-2.0

[package]
name = "uartecho"
publish = false
version.workspace = true
edition.workspace = true
description = "UART loopback through the Layer-2 Bus — the UART porting template"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../kernel", default-features = false }
api = { path = "../../api" }
hal = { path = "../../hal" }

# The two layers this example composes:
#
#   esp32-uart   Layer 1   the controller's registers
#   uart-bus     Layer 2   the transfer-list Bus (this is what it demonstrates)
soc-esp32 = { path = "../../soc/esp32" }
esp32-uart = { path = "../../drivers/physical/esp32/uart" }
uart-bus = { path = "../../drivers/bus/uart-bus" }

[build-dependencies]
build = { path = "../../tools/build" }

[features]
default = ["debug-level-1"]

board-m5-atom-lite = ["kernel/board-m5-atom-lite"]
board-m5-atom-matrix = ["kernel/board-m5-atom-matrix"]
board-esp32-wrover = ["kernel/board-esp32-wrover"]
board-esp32-devkitc = ["kernel/board-esp32-devkitc"]

debug-level-0 = ["kernel/debug-level-0"]
debug-level-1 = ["kernel/debug-level-1"]
debug-level-2 = ["kernel/debug-level-2"]
debug-level-3 = ["kernel/debug-level-3"]

# Declared here as well as in the kernel because `build::link()` runs in this
# crate's build script and reads CARGO_FEATURE_* to size the memory map.
radio-wifi = ["kernel/radio-wifi"]
radio-bt = []
radio-ble = ["radio-bt", "kernel/radio-ble"]
radio-bt-classic = ["radio-bt", "kernel/radio-bt-classic"]
