<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="flintOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272c3a"/>
      <stop offset="1" stop-color="#13151c"/>
    </linearGradient>
    <linearGradient id="spark" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffd884"/>
      <stop offset=".5" stop-color="#f5951f"/>
