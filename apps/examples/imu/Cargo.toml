[package]
name = "imu"
publish = false
version.workspace = true
edition.workspace = true
description = "Reads the Atom Matrix's onboard IMU — the first Layer 1-2-3 assembly"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }

# All three layers, named here because composing them is the point.
#
#   esp32-i2c   Layer 1   the controller's registers
#   i2c-bus     Layer 2   addressing and framing
#   bmi270      Layer 3   the part number
soc-esp32 = { path = "../../../soc/esp32" }
esp32-i2c = { path = "../../../drivers/physical/esp32/i2c" }
i2c-bus = { path = "../../../drivers/bus/i2c-bus" }
bmi270 = { path = "../../../drivers/logical/bmi270" }
mpu6886 = { path = "../../../drivers/logical/mpu6886" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board, debug level and radio mode are chosen on the command line and passed
# straight to the kernel (`--features kernel/board-m5-atom-matrix,kernel/debug-level-2`),
# so this manifest no longer forwards them -- see #120. `imu` needs the Atom
# Matrix (the only board with an onboard IMU); building it for any other board
# is caught by a `const` assert in `main.rs` keyed on the board's name.
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_RADIO_BT to size the DRAM map. Turn a mode on
# with `--features kernel/radio-ble,radio-bt`.
radio-bt = []

