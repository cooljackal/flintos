# SPDX-License-Identifier: Apache-2.0

[package]
name = "demo"
# The name is the interface here, more than for any other package: `make
# APP=demo` and the flashed ELF filename are both this string.
publish = false
version.workspace = true
edition.workspace = true
description = "FlintOS demo application — three tasks at three priorities"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# No default board, deliberately. A default is a board you flash without
# choosing it, and the one that used to be here was the least tested board in
# the tree -- `make flash` with no argument built for hardware nobody had held.
# Selecting a board is one word on the command line; getting it silently wrong
# costs a debugging session against the wrong pin map.
default = ["debug-level-1"]

board-esp32-wrover = ["kernel/board-esp32-wrover"]
board-esp32-devkitc = ["kernel/board-esp32-devkitc"]
board-m5-atom-lite = ["kernel/board-m5-atom-lite"]
board-m5-atom-matrix = ["kernel/board-m5-atom-matrix"]
board-m5-atom = ["kernel/board-m5-atom"]

debug-level-0 = ["kernel/debug-level-0"]
debug-level-1 = ["kernel/debug-level-1"]
debug-level-2 = ["kernel/debug-level-2"]
debug-level-3 = ["kernel/debug-level-3"]

# `radio-bt` is declared here as well as in the kernel because
# `build::link()` runs in *this* crate's build script and reads
# CARGO_FEATURE_*, so the memory map keys off the application's own view of
# whether Bluetooth is on. A mode that forwarded only to the kernel would
# reserve nothing.
radio-wifi = ["kernel/radio-wifi"]
radio-bt = []
radio-ble = ["radio-bt", "kernel/radio-ble"]
radio-bt-classic = ["radio-bt", "kernel/radio-bt-classic"]


# Boot-time register-window self-test. Off by default; `make ... EXTRA_FEATURES=self-test`.
self-test = ["kernel/self-test"]

# Watchdog verification. Each spawns a task that deliberately hangs, one way
# per watchdog, so the reset can be observed rather than assumed. `make
# test-watchdog WDT=kernel` / `WDT=idle`.
watchdog-test-kernel = []
watchdog-test-idle = []
