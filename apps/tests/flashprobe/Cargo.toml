# SPDX-License-Identifier: Apache-2.0

[package]
name = "flashprobe"
publish = false
version.workspace = true
edition.workspace = true
description = "Erases, writes and reads back the nvs partition, with the second core running"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }

soc-esp32 = { path = "../../../soc/esp32" }
# For the second core's entry trampoline; see `second_core`.
arch-xtensa = { path = "../../../arch/xtensa" }
esp32-flash = { path = "../../../drivers/physical/esp32/flash" }
kvstore = { path = "../../../lib/kvstore" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board, debug level and radio mode are chosen on the command line and passed
# straight to the kernel (`--features kernel/board-esp32-devkitc,kernel/debug-level-2`),
# so this manifest no longer forwards them -- see #120.
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_RADIO_BT to size the DRAM map. Turn a mode on
# with `--features kernel/radio-ble,radio-bt`.
radio-bt = []

