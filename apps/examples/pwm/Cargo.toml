# SPDX-License-Identifier: Apache-2.0

[package]
name = "pwm"
publish = false
version.workspace = true
edition.workspace = true
description = "Drives LEDC and measures its own duty cycle by reading the pin back"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }
hal = { path = "../../../hal" }

soc-esp32 = { path = "../../../soc/esp32" }
esp32-ledc = { path = "../../../drivers/physical/esp32/ledc" }
esp32-gpio = { path = "../../../drivers/physical/esp32/gpio" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board, debug level and radio mode are chosen on the command line and passed
# straight to the kernel (`--features kernel/board-m5-atom-matrix,kernel/debug-level-2`),
# so this manifest no longer forwards them -- see #120. `pwm` needs an Atom
# board; the guard for that is a `const` assert in `main.rs` keyed on the
# board's name, not a feature here.
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's: `build::link()` runs in *this* crate's build
# script and reads CARGO_FEATURE_RADIO_BT to size the DRAM map. Turn a mode on
# with `--features kernel/radio-ble,radio-bt`.
radio-bt = []

