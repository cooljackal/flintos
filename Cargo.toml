[workspace]
resolver = "2"
# Directory names carry no `flint-` prefix; package names do.
#
# A package name is a global identifier -- it has to be unambiguous on
# crates.io, hence `flint-hal` rather than `hal`, and `flint-driver-bme280`
# rather than `bme280`, which is already a well-known third-party driver crate
# (as is `ssd1306`). A directory is scoped by its path already, so `hal/`,
# `arch/xtensa/` and `drivers/logical/bme280/` say everything the longer names
# did.
#
# Each layer names itself after what it is portable across, which is the thing
# a reader needs to know before depending on it:
#
#   Layer 3  flint-driver-<device>       flint-driver-bme280, flint-driver-ssd1306
#   Layer 2  flint-<protocol>-bus        flint-spi-bus, flint-i2c-bus, flint-uart-bus
#   Layer 1  flint-<chip>-<peripheral>   flint-esp32-uart, flint-esp32-spi
#
# `flint-driver-` is the namespace the community driver convention reserves
# (see doc/internal/flint_rtos_plan_rev8.md, "Community Driver Convention"):
# a third-party BME280 driver is `flint-driver-bme280` too, so the first-party
# ones cannot sit in a different namespace without splitting it in two. Only
# Layer 3 takes the prefix -- it names an external *device*, which is what the
# convention is about. An ESP32 UART is an on-chip peripheral, not a device,
# and a bus abstraction is not a driver at all.
#
# Stating the directory mapping precisely, because the short version
# ("directory = package minus `flint-`") is not true of every crate here:
#
#   a package's directory leaf is its name minus `flint-`, minus a leading
#   category word when the name repeats one
#
#     flint-hal            -> hal/                          no category
#     flint-esp32-uart     -> drivers/physical/esp32-uart/   leaf is the whole slug
#     flint-driver-bme280  -> drivers/logical/bme280/        slug repeats `driver`
#     flint-arch-xtensa    -> arch/xtensa/                   slug repeats `arch`
#     flint-soc-esp32      -> soc/esp32/                     slug repeats `soc`
#     flint-build          -> tools/build/                   slug omits `tools`
#
# A category word appears in the name only where the bare leaf would be too
# generic to publish: `xtensa`, `esp32` and `bme280` alone are not Flint's to
# claim.
#
# The applications are the one exception, and they are marked rather than
# assumed: `demo` and `hello` have no prefix and set `publish = false`, since
# the package name is also `make APP=<name>` and the flashed ELF filename. An
# unprefixed name is only honest if the crate is never published.
members = [
    "hal",
    "api",
    "arch/xtensa",
    "soc/esp32",
    "kernel",
    "board",
    "tools/build",
    "tools/size",

    # Applications. The kernel is a library; an application is the binary that
    # links it. Adding one here is all that is needed for `make APP=<name>`.
    "apps/hello",
    "apps/demo",

    "drivers/physical/esp32-uart",
    "drivers/physical/esp32-gpio",
    "drivers/physical/esp32-spi",
    "drivers/physical/esp32-i2c",
    "drivers/bus/spi-bus",
    "drivers/bus/i2c-bus",
    "drivers/bus/uart-bus",
    "drivers/logical/bme280",
    "drivers/logical/ssd1306",
]

# Shared metadata. Every member inherits these with `field.workspace = true`
# so version and licence stay in lock-step across every crate.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Farhan Husain <cooljackal@gmail.com>"]
repository = "https://github.com/cooljackal/flintos"
rust-version = "1.86"

# ── Build profiles ────────────────────────────────────────────────────────────
#
# `panic = "abort"` matches the kernel's own #[panic_handler]: there is no
# unwinder on bare metal, and no allocator to support one. Cargo ignores this
# setting for the test/bench profiles, so host-side `cargo test` still works.

[profile.dev]
# opt-level 0 produces very large stack frames on Xtensa -- the trap handler
# alone reserves 272 bytes, and it runs on the *interrupted task's* stack. At
# opt-level 1 frames shrink enough for the 4 KiB default task stack to hold a
# trap plus the calls it makes, while debug info stays fully intact.
opt-level = 1
debug = true
panic = "abort"

[profile.release]
opt-level = "z"     # size is the binding constraint on a 4 MB flash part
lto = true
codegen-units = 1
debug = true        # symbols stay in the ELF; espflash strips them for the image
panic = "abort"
