# SPDX-License-Identifier: Apache-2.0

[package]
name = "demo"
# The name is the interface here, more than for any other package: `make
# APP=demo` and the flashed ELF filename are both this string.
publish = false
version.workspace = true
edition.workspace = true
description = "FlintOS demo application — three tasks at three priorities"
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kernel = { path = "../../../kernel", default-features = false }
api = { path = "../../../api" }

[build-dependencies]
build = { path = "../../../tools/build" }

[features]
# Board, debug level and radio mode are not the application's to declare. They
# belong to the kernel, and the build passes them straight through on the
# command line -- `--features kernel/board-esp32-devkitc,kernel/debug-level-2`,
# `kernel/radio-ble` -- so the ~25 lines of `board-x = ["kernel/board-x"]`
# forwarding that used to live in every app manifest are gone (see #120 and the
# Makefile). What stays below is what this application actually owns.
default = ["kernel/debug-level-1"]

# `radio-bt` is the application's, not the kernel's: `build::link()` runs in
# *this* crate's build script and reads CARGO_FEATURE_RADIO_BT to size the DRAM
# map, so the reservation keys off the application's own view of whether
# Bluetooth is linked. Turn a mode on with `--features kernel/radio-ble,radio-bt`
# -- the kernel gets the mode, and the memory map is reserved here.
radio-bt = []

# Boot-time register-window self-test. Off by default; `make ... EXTRA_FEATURES=self-test`.
self-test = ["kernel/self-test"]

# Watchdog verification. Each spawns a task that deliberately hangs, one way
# per watchdog, so the reset can be observed rather than assumed. `make
# test-watchdog WDT=kernel` / `WDT=idle`.
watchdog-test-kernel = []
watchdog-test-idle = []
